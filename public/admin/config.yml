# The dashboard for the RadioWBF website. Open yoursite/admin and sign in with GitHub.
backend:
  name: github
  repo: 1984ksr-maker/radiowbf
  branch: main
media_folder: public/img
public_folder: /img
site_url: https://radiowbf.de
display_url: https://radiowbf.de
logo_url: /img/logo.png
collections:
- name: shows
  label: Shows
  label_singular: Show
  folder: src/content/shows
  create: true
  extension: md
  format: frontmatter
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  sortable_fields:
  - date
  - title
  summary: '{{title}} ({{date}})'
  fields:
  - name: title
    label: Title
    widget: string
  - name: date
    label: Date of the broadcast
    widget: datetime
    time_format: false
    date_format: YYYY-MM-DD
    format: YYYY-MM-DD
  - name: categories
    label: Categories
    widget: select
    multiple: true
    required: false
    options:
    - DJ Sets
    - Talk Shows
    - Open Call
  - name: curator
    label: Curated by
    widget: string
    required: false
  - name: image
    label: Main picture
    widget: image
    required: false
  - name: imageAlt
    label: Describe the picture (for screen readers)
    widget: string
    required: false
  - name: gallery
    label: More pictures
    widget: list
    required: false
    field:
      name: image
      label: Picture
      widget: image
  - name: soundcloud
    label: SoundCloud link (track or playlist)
    widget: string
    required: false
  - name: mixcloud
    label: Mixcloud link
    widget: string
    required: false
  - name: link
    label: Extra link
    widget: string
    required: false
  - name: linkLabel
    label: Extra link text
    widget: string
    required: false
  - name: featured
    label: Featured in the big slider
    widget: boolean
    required: false
    default: false
  - name: body
    label: Text
    widget: markdown
- name: pages
  label: Pages
  files:
  - name: about
    label: About page
    file: src/content/pages/about.md
    fields: &id001
    - name: title
      label: Title
      widget: string
    - name: intro
      label: Opening sentence
      widget: text
      required: false
    - name: images
      label: Pictures
      widget: list
      required: false
      field:
        name: image
        label: Picture
        widget: image
    - name: body
      label: Text
      widget: markdown
  - name: support
    label: Support page
    file: src/content/pages/support.md
    fields: *id001
  - name: impressum
    label: Impressum
    file: src/content/pages/impressum.md
    fields: *id001
  - name: datenschutz
    label: Datenschutz
    file: src/content/pages/datenschutz.md
    fields: *id001
- name: settings
  label: Station settings
  files:
  - name: site
    label: Station settings
    file: src/data/site.json
    format: json
    fields:
    - name: name
      label: Short name
      widget: string
    - name: fullName
      label: Full name
      widget: string
    - name: tagline
      label: Tagline
      widget: string
    - name: motto
      label: Motto
      widget: string
    - name: description
      label: Description for search engines and link previews
      widget: text
    - name: logo
      label: Logo
      widget: image
    - name: colors
      label: Colours
      widget: object
      fields:
      - name: accent
        label: Accent colour (Live button, on air)
        widget: color
      - name: ink
        label: Text colour
        widget: color
      - name: paper
        label: Background colour
        widget: color
    - name: channels
      label: Live inputs (players)
      widget: list
      summary: '{{name}}'
      fields:
      - name: name
        label: Name
        widget: string
      - name: label
        label: Small line under the name
        widget: string
        required: false
      - name: stream
        label: Stream address
        widget: string
      - name: onAir
        label: On air now
        widget: boolean
        required: false
        default: false
      - name: show
        label: Show on the website
        widget: boolean
        required: false
        default: true
      - name: airtimeInfo
        label: Show now playing from Airtime
        widget: boolean
        required: false
        default: false
    - name: liveNote
      label: Short live note under the player
      widget: string
      required: false
    - name: airtime
      label: Airtime address (now playing and schedule)
      widget: string
    - name: player
      label: Player texts
      widget: object
      fields:
      - name: sectionTitle
        label: Title above the live inputs
        widget: string
      - name: onAirTitle
        label: Label on the input that is on air
        widget: string
      - name: popoutButton
        label: Button for the small player window
        widget: string
    - name: home
      label: Start page texts
      widget: object
      fields:
      - name: freshTitle
        label: Band above the newest shows
        widget: string
      - name: archiveButton
        label: Archive link
        widget: string
      - name: scheduleTitle
        label: Band above the schedule
        widget: string
      - name: chatTitle
        label: Title above the webchat
        widget: string
      - name: posterShow
        label: Show the big orange block
        widget: boolean
      - name: posterKicker
        label: Big block small line
        widget: string
        required: false
      - name: posterTitle
        label: Big block title
        widget: string
      - name: posterText
        label: Big block text
        widget: text
      - name: posterButton
        label: Big block button
        widget: string
        required: false
      - name: posterLink
        label: Big block button link
        widget: string
        required: false
      - name: posterImage
        label: Big block picture
        widget: image
        required: false
    - name: support
      label: Supporter block
      widget: object
      fields:
      - name: show
        label: Show on the start page
        widget: boolean
      - name: title
        label: Title
        widget: string
      - name: text
        label: Text
        widget: text
      - name: button
        label: Button text
        widget: string
      - name: link
        label: Donation link (empty opens the Support page)
        widget: string
        required: false
    - name: pagesIntro
      label: Page introductions
      widget: object
      fields:
      - name: archive
        label: Archive page
        widget: text
      - name: schedule
        label: Schedule page
        widget: text
      - name: chat
        label: Chat page
        widget: text
    - name: footer
      label: Footer
      widget: object
      fields:
      - name: text1
        label: First paragraph
        widget: text
      - name: text2
        label: Second paragraph
        widget: text
        required: false
      - name: greeting
        label: Greetings (separated by commas)
        widget: list
    - name: labels
      label: Interface words (every button and label)
      widget: object
      collapsed: true
      fields:
      - name: navPlayer
        label: 'Menu: Player'
        widget: string
      - name: navArchive
        label: 'Menu: Archive'
        widget: string
      - name: navSchedule
        label: 'Menu: Schedule'
        widget: string
      - name: navChat
        label: 'Menu: Chat'
        widget: string
      - name: navAbout
        label: 'Menu: About'
        widget: string
      - name: navSupport
        label: 'Menu: Support'
        widget: string
      - name: navListen
        label: 'Menu: Listen (start page)'
        widget: string
      - name: menu
        label: Phone menu button
        widget: string
      - name: close
        label: Phone menu close button
        widget: string
      - name: live
        label: The big Live button
        widget: string
      - name: onAir
        label: On air label
        widget: string
      - name: featured
        label: Label on the big slider
        widget: string
      - name: listen
        label: Listen button
        widget: string
      - name: listenToShow
        label: Listen button on a show page
        widget: string
      - name: fromArchive
        label: Top bar text while an archive show plays
        widget: string
      - name: allLink
        label: Small 'All' link on the black bands
        widget: string
      - name: weekLink
        label: Link on the schedule band
        widget: string
      - name: playerLink
        label: Link on the Tune in band
        widget: string
      - name: archiveTitle
        label: Archive page title
        widget: string
      - name: scheduleTitle
        label: Schedule page title
        widget: string
      - name: chatTitle
        label: Chat page title
        widget: string
      - name: openChat
        label: Link under the chat
        widget: string
      - name: filterAll
        label: First archive filter
        widget: string
      - name: emptyCategory
        label: Archive text when a category is empty
        widget: string
      - name: playAllSoundcloud
        label: Archive button to play all of SoundCloud
        widget: string
      - name: openOnSoundcloud
        label: Link to the SoundCloud page
        widget: string
      - name: curatedBy
        label: Words before the curator name
        widget: string
      - name: newer
        label: Newer show link
        widget: string
      - name: older
        label: Older show link
        widget: string
      - name: more
        label: Extra link default text
        widget: string
      - name: loadingWeek
        label: Schedule while loading
        widget: string
      - name: nothingPlanned
        label: Schedule when a day is empty
        widget: string
      - name: scheduleError
        label: Schedule when Airtime cannot be reached
        widget: string
      - name: quiet
        label: Text when a channel is silent
        widget: string
      - name: days
        label: Day names, Monday first, separated by commas
        widget: list
      - name: supportMarquee
        label: Word on the orange band of the Support page
        widget: string
      - name: instagramTitle
        label: Word on the Instagram band
        widget: string
      - name: instagramLink
        label: Link on the Instagram band
        widget: string
      - name: lostTitle
        label: Page not found title
        widget: string
      - name: lostText
        label: Page not found text
        widget: string
      - name: findUs
        label: Line at the end of the About page
        widget: string
    - name: mixcloudUser
      label: Mixcloud username (archive fills itself)
      widget: string
      required: false
    - name: soundcloud
      label: SoundCloud profile link
      widget: string
    - name: soundcloudUserId
      label: SoundCloud user number (new tracks appear by themselves)
      widget: string
      required: false
    - name: instagram
      label: Instagram link
      widget: string
    - name: instagramFeed
      label: Instagram feed address from behold.so (latest posts appear by themselves)
      widget: string
      required: false
    - name: chat
      label: Chat address
      widget: string
    - name: email
      label: Contact email
      widget: string
      required: false
