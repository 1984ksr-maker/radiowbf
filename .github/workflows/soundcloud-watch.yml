# Looks at the RadioWBF SoundCloud feed every 30 minutes.
# When a new track is uploaded, it writes the newest track address into
# src/data/soundcloud-latest.txt and saves it. That save makes Cloudflare
# rebuild the website, so the upload appears as a post by itself.
name: SoundCloud watch
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for new uploads
        run: |
          ID=$(python3 -c "import json;print(json.load(open('src/data/site.json')).get('soundcloudUserId',''))")
          if [ -z "$ID" ]; then echo "No SoundCloud user number"; exit 0; fi
          FEED="https://feeds.soundcloud.com/users/soundcloud:users:$ID/sounds.rss"
          curl -fsSL "$FEED" -o feed.rss || { echo "Feed not reachable"; exit 0; }
          # A fingerprint of every track's title, link, text and picture, so a new upload
          # and also a changed name, text or cover make the website rebuild.
          NEWEST=$(python3 -c "import hashlib,xml.etree.ElementTree as E;c=E.parse('feed.rss').getroot().find('channel');print(hashlib.sha1('\n'.join('|'.join([i.findtext('title') or '',i.findtext('link') or '',i.findtext('description') or '']+[e.get('href') or '' for e in i if e.tag.endswith('image')]) for i in c.findall('item')).encode()).hexdigest() if c is not None and c.find('item') is not None else '')")
          OLD=$(cat src/data/soundcloud-latest.txt 2>/dev/null || true)
          echo "Fingerprint: $NEWEST"
          if [ -z "$NEWEST" ] || [ "$NEWEST" = "$OLD" ]; then echo "Nothing changed"; exit 0; fi
          echo "$NEWEST" > src/data/soundcloud-latest.txt
          git config user.name "RadioWBF bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/soundcloud-latest.txt
          git commit -m "SoundCloud updated"
          git push
